<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФОНОТЕКА — общая музыкальная библиотека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2024;
    --panel-2: #22262b;
    --line: #2c3136;
    --text: #ece7dd;
    --muted: #8b9198;
    --accent: #d9a441;
    --danger: #b5544a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:110px;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:48px 24px 24px; }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:28px;
  }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:34px; margin:0; cursor:pointer; }
  h1 span{ color:var(--accent); }
  .count{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.5px;
    color:var(--accent); cursor:pointer; margin-bottom:18px; text-transform:uppercase;
  }
  .back-link:hover{ opacity:0.8; }

  .add-panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:24px; }
  .add-panel summary{ cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); outline:none; }
  .file-drop{
    margin-top:16px; border:1px dashed var(--line); border-radius:8px; padding:18px;
    display:flex; align-items:center; gap:14px; cursor:pointer; background:var(--panel-2);
  }
  .file-drop:hover{ border-color:var(--accent); }
  .file-drop .cover-preview{
    width:52px; height:52px; border-radius:6px; background:var(--line);
    flex-shrink:0; object-fit:cover; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:20px;
  }
  .file-drop-text{ font-size:13px; color:var(--muted); line-height:1.5; }
  .file-drop-text b{ color:var(--text); }
  input[type=file]{ display:none; }

  .add-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .add-grid .full{ grid-column:1 / -1; }
  label{ display:block; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--muted); margin-bottom:5px; letter-spacing:0.5px; }
  input[type=text], input[type=url]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px;
  }
  input:focus{ outline:1px solid var(--accent); border-color:var(--accent); }
  .add-btn{
    margin-top:14px; background:var(--accent); color:#1a1a1a; border:none;
    padding:10px 18px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .add-btn:hover{ background:#e6b559; }
  .add-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .hint{ font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .hint.warn{ color:var(--accent); }

  .tools{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search-box{ flex:1; min-width:180px; position:relative; }
  .search-box input{ padding-left:34px; }
  .search-box::before{ content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px; }
  select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:13px; }

  .artist-header{ display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .artist-header .cover-lg{ width:72px; height:72px; border-radius:8px; object-fit:cover; background:var(--panel-2); flex-shrink:0; }
  .artist-header h2{ font-family:'Fraunces',serif; font-size:28px; margin:0 0 4px; }
  .artist-header .sub{ font-size:13px; color:var(--muted); }

  .catalog{ list-style:none; margin:0; padding:0; }
  .catalog li{
    display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:14px;
    padding:10px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px;
  }
  .catalog li:hover{ background:var(--panel); }
  .catalog li.playing{ background:var(--panel-2); }
  .catalog li.playing .t-title{ color:var(--accent); }
  .cover-sm{ width:38px; height:38px; border-radius:5px; object-fit:cover; background:var(--panel-2); display:block; }
  .cover-sm.empty::before{ content:"♪"; color:var(--muted); display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:14px; }
  .t-title{ font-weight:600; font-size:14px; }
  .t-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .t-sub .artist-link{ cursor:pointer; text-decoration:none; }
  .t-sub .artist-link:hover{ color:var(--accent); text-decoration:underline; }
  .del-btn{ background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 8px; }
  .del-btn:hover{ color:var(--danger); }
  .empty{ text-align:center; color:var(--muted); padding:50px 20px; font-size:14px; line-height:1.7; }
  .empty b{ color:var(--text); }

  .player{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 20px 16px; }
  .player-inner{ max-width:820px; margin:0 auto; }
  .now{ display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .now img{ width:34px; height:34px; border-radius:5px; object-fit:cover; background:var(--panel-2); flex-shrink:0; }
  .now-title{ font-family:'Fraunces',serif; font-size:16px; }
  .now-sub{ font-size:12px; color:var(--muted); }
  .prog-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); min-width:34px; }
  input[type=range]{ -webkit-appearance:none; flex:1; height:3px; background:var(--line); border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); cursor:pointer; margin-top:-4.5px; }
  .ctrl-row{ display:flex; align-items:center; justify-content:space-between; }
  .transport{ display:flex; gap:8px; align-items:center; }
  .transport button{ background:none; border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .transport button.play{ background:var(--accent); border-color:var(--accent); color:#1a1a1a; width:44px; height:44px; font-size:17px; }
  .transport button:hover{ border-color:var(--accent); }
  .vol-row{ display:flex; align-items:center; gap:8px; width:110px; }
  .vol-row span{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 onclick="goHome()">ФОНО<span>ТЕКА</span></h1>
    <div class="count" id="count">0 треков</div>
  </header>

  <div id="main-content"></div>
</div>

<div class="player">
  <div class="player-inner">
    <div class="now">
      <img id="now-cover" src="" style="display:none">
      <div>
        <div class="now-title" id="now-title">Ничего не играет</div>
        <div class="now-sub" id="now-sub">—</div>
      </div>
    </div>
    <div class="prog-row">
      <span class="time" id="cur-time">0:00</span>
      <input type="range" id="progress" value="0" max="100">
      <span class="time" id="dur-time">0:00</span>
    </div>
    <div class="ctrl-row">
      <div class="transport">
        <button onclick="prevTrack()">⏮</button>
        <button class="play" id="play-btn" onclick="playPause()">▶</button>
        <button onclick="nextTrack()">⏭</button>
      </div>
      <div class="vol-row"><span>🔊</span><input type="range" id="volume" min="0" max="1" step="0.01" value="1"></div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
let library = [];
let currentIndex = -1;      // index into library
let playQueue = [];         // list of library-indices currently playable (depends on view)
let pendingMeta = { title:'', artist:'', album:'', cover:'' };

const audio = document.getElementById('audio');
const STORAGE_KEY = 'fonoteka-library';

// ---------- storage ----------
async function loadLibrary(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    library = res ? JSON.parse(res.value) : [];
  }catch(e){
    library = [];
  }
  route();
}
async function saveLibrary(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(library), true);
  }catch(e){
    console.error('Не удалось сохранить библиотеку', e);
    alert('Не удалось сохранить изменения. Попробуйте ещё раз.');
  }
}

// ---------- routing ----------
function goHome(){ location.hash = ''; }
function goToArtist(name){ location.hash = 'artist/' + encodeURIComponent(name); }
window.addEventListener('hashchange', route);

function route(){
  const hash = location.hash.replace(/^#/, '');
  if(hash.startsWith('artist/')){
    renderArtistView(decodeURIComponent(hash.slice(7)));
  }else{
    renderLibraryView();
  }
  document.getElementById('count').textContent = library.length + (library.length === 1 ? ' трек' : ' треков');
}

// ---------- ID3 metadata reading ----------
function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('f-filename').textContent = file.name;
  pendingMeta = { title:'', artist:'', album:'', cover:'' };

  if(typeof jsmediatags === 'undefined'){
    document.getElementById('f-title').value = guessTitleFromFilename(file.name);
    updateAddBtnState();
    return;
  }

  jsmediatags.read(file, {
    onSuccess: function(tag){
      const t = tag.tags;
      pendingMeta.title = t.title || guessTitleFromFilename(file.name);
      pendingMeta.artist = t.artist || '';
      pendingMeta.album = t.album || '';
      if(t.picture){
        try{
          const { data, format } = t.picture;
          let binary = '';
          for(let i=0;i<data.length;i++){ binary += String.fromCharCode(data[i]); }
          pendingMeta.cover = `data:${format};base64,${window.btoa(binary)}`;
        }catch(err){ pendingMeta.cover = ''; }
      }
      document.getElementById('f-title').value = pendingMeta.title;
      document.getElementById('f-artist').value = pendingMeta.artist;
      document.getElementById('f-album').value = pendingMeta.album;
      updateCoverPreview(pendingMeta.cover);
      updateAddBtnState();
    },
    onError: function(){
      document.getElementById('f-title').value = guessTitleFromFilename(file.name);
      updateAddBtnState();
    }
  });
}
function guessTitleFromFilename(name){
  return name.replace(/\.[^/.]+$/, '').replace(/^\d+[\s\-\.]*/, '');
}
function updateCoverPreview(dataUrl){
  const el = document.getElementById('cover-preview');
  if(dataUrl){
    el.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">`;
  }else{
    el.innerHTML = '♪';
  }
}
function updateAddBtnState(){
  const url = document.getElementById('f-url').value.trim();
  const title = document.getElementById('f-title').value.trim();
  document.getElementById('add-btn').disabled = !(url && title);
}

// ---------- add / delete ----------
function addTrack(){
  const url = document.getElementById('f-url').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const artist = document.getElementById('f-artist').value.trim() || 'Неизвестен';
  const album = document.getElementById('f-album').value.trim() || '—';
  const cover = pendingMeta.cover || '';

  if(!url || !title){ alert('Укажите ссылку и название трека'); return; }

  library.push({ url, title, artist, album, cover });
  saveLibrary();

  document.getElementById('f-url').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-artist').value = '';
  document.getElementById('f-album').value = '';
  document.getElementById('f-filename').textContent = 'Выбрать mp3-файл (для авточтения тегов)';
  pendingMeta = { title:'', artist:'', album:'', cover:'' };
  updateCoverPreview('');
  updateAddBtnState();

  route();
}

function deleteTrack(libIdx, ev){
  ev.stopPropagation();
  if(!confirm('Удалить трек из общей фонотеки? Это затронет всех.')) return;
  if(libIdx === currentIndex){
    audio.pause();
    currentIndex = -1;
    setNowPlaying(null);
    setPlayIcon(false);
  }
  library.splice(libIdx, 1);
  saveLibrary();
  route();
}

// ---------- rendering: library view ----------
function renderLibraryView(){
  const c = document.getElementById('main-content');
  c.innerHTML = `
    <details class="add-panel">
      <summary>+ добавить трек</summary>
      <label style="margin-top:16px;display:block;">Файл с компьютера</label>
      <div class="file-drop" onclick="document.getElementById('file-input').click()">
        <div class="cover-preview" id="cover-preview" style="width:52px;height:52px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);">♪</div>
        <div class="file-drop-text"><b id="f-filename">Выбрать mp3-файл (для авточтения тегов)</b><br>Название, исполнитель, альбом и обложка подтянутся автоматически</div>
      </div>
      <input type="file" id="file-input" accept="audio/mpeg,audio/mp3,.mp3" onchange="handleFileSelect(event)">

      <div class="add-grid">
        <div class="full">
          <label>Прямая ссылка на mp3 (куда вы его сами загрузите)</label>
          <input type="url" id="f-url" placeholder="https://.../track.mp3" oninput="updateAddBtnState()">
        </div>
        <div><label>Название</label><input type="text" id="f-title" oninput="updateAddBtnState()"></div>
        <div><label>Исполнитель</label><input type="text" id="f-artist"></div>
        <div class="full"><label>Альбом</label><input type="text" id="f-album"></div>
      </div>
      <button class="add-btn" id="add-btn" onclick="addTrack()" disabled>Добавить в фонотеку</button>
      <p class="hint">Сам аудиофайл всё равно нужно загрузить на ваш сайт (репозиторий) — браузер не может сам «захостить» файл. Но метаданные из тегов файла считываются автоматически, вручную вводить почти ничего не нужно.</p>
      <p class="hint warn">Библиотека общая — видна всем, кто заходит на сайт, и любой посетитель может добавлять и удалять треки.</p>
    </details>

    <div class="tools">
      <div class="search-box"><input type="text" id="search" placeholder="Поиск по треку, артисту или альбому..." oninput="renderLibraryView()"></div>
      <select id="filter-artist" onchange="renderLibraryView()"></select>
      <select id="filter-album" onchange="renderLibraryView()"></select>
    </div>

    <ul class="catalog" id="catalog"></ul>
  `;

  populateFilters();
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const fArtist = document.getElementById('filter-artist').value;
  const fAlbum = document.getElementById('filter-album').value;

  const indices = [];
  library.forEach((t, i) => {
    const matchesQ = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) || t.album.toLowerCase().includes(q);
    const matchesArtist = !fArtist || t.artist === fArtist;
    const matchesAlbum = !fAlbum || t.album === fAlbum;
    if(matchesQ && matchesArtist && matchesAlbum) indices.push(i);
  });
  playQueue = indices;
  renderCatalog(indices, true);
}

function populateFilters(){
  const artistSel = document.getElementById('filter-artist');
  const albumSel = document.getElementById('filter-album');
  const curArtist = artistSel.dataset.kept || '';
  const curAlbum = albumSel.dataset.kept || '';
  const artists = [...new Set(library.map(t => t.artist))].sort();
  const albums = [...new Set(library.map(t => t.album))].sort();
  artistSel.innerHTML = '<option value="">Все исполнители</option>' + artists.map(a => `<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join('');
  albumSel.innerHTML = '<option value="">Все альбомы</option>' + albums.map(a => `<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join('');
}

// ---------- rendering: artist view ----------
function renderArtistView(artistName){
  const tracks = library.map((t,i)=>({...t, _i:i})).filter(t => t.artist === artistName);
  const cover = (tracks.find(t => t.cover) || {}).cover || '';
  const albums = [...new Set(tracks.map(t=>t.album))];

  const c = document.getElementById('main-content');
  c.innerHTML = `
    <div class="back-link" onclick="goHome()">← вся фонотека</div>
    <div class="artist-header">
      ${cover ? `<img class="cover-lg" src="${cover}">` : `<div class="cover-lg" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;">♪</div>`}
      <div>
        <h2>${escapeHtml(artistName)}</h2>
        <div class="sub">${tracks.length} ${plural(tracks.length)} · ${albums.length} ${plural(albums.length,'альбом','альбома','альбомов')}</div>
      </div>
    </div>
    <ul class="catalog" id="catalog"></ul>
  `;
  const indices = tracks.map(t => t._i);
  playQueue = indices;
  renderCatalog(indices, false);
}

function plural(n, one='трек', few='трека', many='треков'){
  const mod10 = n%10, mod100 = n%100;
  if(mod10===1 && mod100!==11) return one;
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return few;
  return many;
}

// ---------- shared catalog rendering ----------
function renderCatalog(indices, showArtistLink){
  const ul = document.getElementById('catalog');
  document.getElementById('count').textContent = library.length + ' ' + plural(library.length);

  if(indices.length === 0){
    ul.innerHTML = `<div class="empty">${library.length === 0
      ? 'Фонотека пуста. Откройте <b>«+ добавить трек»</b> и добавьте первый.'
      : 'Ничего не найдено.'}</div>`;
    return;
  }

  ul.innerHTML = indices.map((libIdx, pos) => {
    const t = library[libIdx];
    const isPlaying = libIdx === currentIndex;
    const coverHtml = t.cover
      ? `<img class="cover-sm" src="${t.cover}">`
      : `<div class="cover-sm empty"></div>`;
    const artistHtml = showArtistLink
      ? `<span class="artist-link" onclick="event.stopPropagation(); goToArtist('${escapeAttr(t.artist)}')">${escapeHtml(t.artist)}</span>`
      : escapeHtml(t.artist);
    return `<li class="${isPlaying?'playing':''}" onclick="playTrack(${libIdx})">
      ${coverHtml}
      <span>
        <div class="t-title">${escapeHtml(t.title)}</div>
        <div class="t-sub">${artistHtml} · ${escapeHtml(t.album)}</div>
      </span>
      <button class="del-btn" onclick="deleteTrack(${libIdx}, event)">✕</button>
    </li>`;
  }).join('');
}

// ---------- player ----------
function setNowPlaying(t){
  const img = document.getElementById('now-cover');
  if(t && t.cover){ img.src = t.cover; img.style.display='block'; }else{ img.style.display='none'; }
  document.getElementById('now-title').textContent = t ? t.title : 'Ничего не играет';
  document.getElementById('now-sub').textContent = t ? (t.artist + ' · ' + t.album) : '—';
}

function playTrack(libIdx){
  currentIndex = libIdx;
  const t = library[libIdx];
  audio.src = t.url;
  audio.play().catch(()=>{});
  setNowPlaying(t);
  setPlayIcon(true);
  const hash = location.hash.replace(/^#/, '');
  if(hash.startsWith('artist/')) renderArtistView(decodeURIComponent(hash.slice(7)));
  else renderLibraryView();
}
function playPause(){
  if(currentIndex === -1){ if(playQueue.length) playTrack(playQueue[0]); return; }
  if(audio.paused){ audio.play(); setPlayIcon(true); } else { audio.pause(); setPlayIcon(false); }
}
function setPlayIcon(playing){ document.getElementById('play-btn').textContent = playing ? '❚❚' : '▶'; }
function nextTrack(){
  if(!playQueue.length) return;
  const pos = playQueue.indexOf(currentIndex);
  playTrack(playQueue[(pos===-1?0:pos+1) % playQueue.length]);
}
function prevTrack(){
  if(!playQueue.length) return;
  const pos = playQueue.indexOf(currentIndex);
  playTrack(playQueue[(pos===-1?0:pos-1+playQueue.length) % playQueue.length]);
}
audio.addEventListener('ended', nextTrack);
audio.ontimeupdate = () => {
  if(audio.duration){
    document.getElementById('progress').value = (audio.currentTime/audio.duration)*100;
    document.getElementById('cur-time').textContent = formatTime(audio.currentTime);
    document.getElementById('dur-time').textContent = formatTime(audio.duration);
  }
};
document.getElementById('progress').onchange = () => { if(audio.duration) audio.currentTime = (document.getElementById('progress').value/100)*audio.duration; };
document.getElementById('volume').oninput = (e) => { audio.volume = e.target.value; };

// ---------- utils ----------
function formatTime(sec){ if(!isFinite(sec)) return '0:00'; const m=Math.floor(sec/60); const s=Math.floor(sec%60).toString().padStart(2,'0'); return `${m}:${s}`; }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str){ return String(str).replace(/"/g,'&quot;'); }

loadLibrary();
</script>
</body>
</html>
