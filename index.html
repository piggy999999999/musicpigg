<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPigg</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="nav-brand">🎵 MusicPigg</div>
        <div class="nav-links">
            <a href="#" onclick="showPage('home')" class="nav-link active" id="nav-home">Главная</a>
            <a href="#" onclick="showPage('search')" class="nav-link" id="nav-search">Поиск</a>
            <a href="#" onclick="showPage('albums')" class="nav-link" id="nav-albums">Альбомы</a>
        </div>
    </nav>

    <!-- Главная -->
    <div id="page-home" class="page active">
        <div class="player-container">
            <div class="current-track-info">
                <img id="currentCover" src="" alt="" class="current-cover">
                <div class="current-track-text">
                    <h2 id="currentTrackTitle">Ничего не играет</h2>
                    <p id="currentTrackArtist"></p>
                </div>
            </div>
            <audio id="audio"></audio>
            <div class="controls">
                <button onclick="prevTrack()" class="ctrl-btn">⏮</button>
                <button onclick="playPause()" class="ctrl-btn play-btn" id="playPauseBtn">▶️</button>
                <button onclick="nextTrack()" class="ctrl-btn">⏭</button>
                <button onclick="toggleShuffle()" class="ctrl-btn" id="shuffleBtn">🔀</button>
            </div>
            <input type="range" id="progress" value="0" max="100" class="progress-bar">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="volume-control">
                <span>🔈</span>
                <input type="range" id="volume" value="1" min="0" max="1" step="0.01">
                <span>🔊</span>
            </div>
        </div>
        <div class="queue-section">
            <h3>Очередь воспроизведения</h3>
            <ul id="queueList" class="track-list"></ul>
        </div>
    </div>

    <!-- Поиск -->
    <div id="page-search" class="page">
        <h2>Поиск треков</h2>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по названию или исполнителю..." oninput="searchTracks()">
        </div>
        <div id="searchResultsContainer">
            <ul id="searchResults" class="track-list"></ul>
        </div>
    </div>

    <!-- Альбомы -->
    <div id="page-albums" class="page">
        <h2>Альбомы</h2>
        <div id="albumsGrid" class="albums-grid"></div>
    </div>

    <!-- Страница исполнителя -->
    <div id="page-artist" class="page">
        <div class="artist-header">
            <img id="artistPhoto" src="" alt="" class="artist-photo">
            <div class="artist-info">
                <h1 id="artistName"></h1>
                <button onclick="playAllArtistTracks()" class="play-all-btn">▶️ Играть все</button>
            </div>
        </div>
        <h3>Треки</h3>
        <ul id="artistTracks" class="track-list"></ul>
        <h3>Альбомы</h3>
        <div id="artistAlbums" class="albums-grid"></div>
    </div>

    <!-- Страница альбома -->
    <div id="page-album" class="page">
        <div class="album-header">
            <img id="albumCover" src="" alt="" class="album-cover">
            <div class="album-info">
                <h1 id="albumTitle"></h1>
                <p id="albumArtist"></p>
                <p id="albumYear"></p>
                <button onclick="playAllAlbumTracks()" class="play-all-btn">▶️ Играть альбом</button>
            </div>
        </div>
        <h3>Треклист</h3>
        <ul id="albumTracks" class="track-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
